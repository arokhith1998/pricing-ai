[pytest]
# 2026-09-27 fix (QA re-eval): with no config at all, plain `python -m
# pytest -q` from the repo root happens to pick up neon/test_migrations.py
# via default recursive discovery, but that is an accident of cwd and
# invocation, not a guarantee -- CI (.github/workflows/ci.yml) and any local
# run from a different working directory are one `cd` away from silently
# skipping the migration up/down pairing test. testpaths pins collection to
# exactly the two suites that exist, regardless of invocation directory.
testpaths =
    tests
    neon
