# Enforces the gates that were previously only ever run by hand. A green local
# run is not evidence when nothing re-runs it on every push: the Salesforce
# OAuth tamper test failed roughly one run in sixteen for weeks without anyone
# seeing it, because it was only ever observed passing once.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  web:
    name: Web lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint
      - run: npx tsc --noEmit
      - run: npm test
      # Deliberately no secrets. Every module-scope env read has a fallback, so
      # a missing value is a runtime concern and the build must not need one.
      # If this step ever starts requiring a secret, that is the regression.
      - run: npm run build
