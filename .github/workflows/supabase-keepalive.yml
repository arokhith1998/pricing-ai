# Keeps the free-tier Supabase project from pausing (7-day inactivity pause
# took down prod lead capture on 2026-06-11) and doubles as a basic uptime
# check: a failed run emails the repo owner.
name: keepalive-and-uptime

on:
  schedule:
    - cron: "0 9 * * 1,4" # Mon + Thu 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase REST ping (counts as project activity)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "User-Agent: pricekeel-keepalive/1.0" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/leads?select=id&limit=1")
          echo "supabase status=$code"
          test "$code" = "200"

      - name: API health (Render)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            "https://api.pricekeel.com/health")
          echo "api status=$code"
          test "$code" = "200"

      - name: Web (Vercel)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            "https://www.pricekeel.com/")
          echo "web status=$code"
          test "$code" = "200"
